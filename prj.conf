# DJI-Remote-nRFConnect -- application configuration
#
# Board / pin assignment lives in boards/promicro_nrf52840_common.dtsi

# --- Peripherals ---------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_SERIAL=y
CONFIG_INPUT=y

# --- Display (ST7789V over MIPI DBI / SPIM3) -----------------------------
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

# --- Logging ------------------------------------------------------------
CONFIG_LOG=y
CONFIG_DJI_REMOTE_LOG_LEVEL_INF=y

# --- Bluetooth ----------------------------------------------------------
# Multirole: central for up to BLE_MAX_CAMERAS cameras, plus peripheral /
# broadcaster for the wake broadcast (a connectable ADV_IND, which needs a
# spare connection object -- hence MAX_CONN = 3 cameras + 1).
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_DEVICE_NAME="DJI-Remote"

# No pairing/encryption: DJI cameras withhold notifications from clients that
# advertise encryption support but never pair (same as the original firmware,
# which ran NimBLE with CONFIG_BT_NIMBLE_SECURITY_ENABLE=n).
CONFIG_BT_SMP=n

# ATT MTU 500, same as the original firmware
# (CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=500). This is expensive in RAM with
# four links on a 256 KB part -- lowering it is tracked as a separate
# parameter-tuning change, not part of the port itself.
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=500

# --- Console / logging over USB CDC ACM ---------------------------------
# The Pro Micro has no debug UART broken out; the board devicetree already
# points zephyr,console at a CDC ACM node, so the USB device stack just has
# to come up at boot. Logs appear on the USB serial port.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# --- Kernel -------------------------------------------------------------
# The FreeRTOS compatibility shim creates the ported tasks at runtime with
# xTaskCreate(), which needs dynamically allocated thread stacks.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# gps_reader.c logs its task stack high-watermark, which needs the
# stacks to be pre-filled so the unused part can be measured.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# --- LVGL ---------------------------------------------------------------
# Same LVGL version (9.5.0) as the original project.
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16

# Rendering buffers: the original used two 320x40 partial buffers
# (lvgl_port_display_cfg_t.buffer_size = M5_LCD_H_RES * 40, double_buffer).
# 40 of 240 rows is 17% of the display.
CONFIG_LV_Z_VDB_SIZE=17
CONFIG_LV_Z_DOUBLE_VDB=y

# LVGL runs on its own workqueue and hands out the lock that the UI code
# takes through lvgl_port_lock()/lvgl_port_unlock().
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_Z_AUTO_INIT=y

# Matches the original sdkconfig.defaults
CONFIG_LV_DEF_REFR_PERIOD=33
CONFIG_LV_DPI_DEF=130
CONFIG_LV_USE_BIDI=n
CONFIG_LV_USE_ARABIC_PERSIAN_CHARS=n
CONFIG_LV_USE_SYSMON=n
CONFIG_LV_USE_PERF_MONITOR=n
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y

# --- Persistent storage (the NVS shim) ----------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Hardware RNG behind esp_random()
CONFIG_ENTROPY_GENERATOR=y
