# DJI-Remote-nRFConnect -- application configuration
#
# Board / pin assignment lives in boards/promicro_nrf52840_common.dtsi

# --- Peripherals ---------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_SERIAL=y
CONFIG_INPUT=y

# --- Display (ST7789V over MIPI DBI / SPIM3) -----------------------------
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

# --- Logging ------------------------------------------------------------
CONFIG_LOG=y
CONFIG_DJI_REMOTE_LOG_LEVEL_INF=y

# --- Bluetooth ----------------------------------------------------------
# Multirole: central for up to BLE_MAX_CAMERAS cameras, plus peripheral /
# broadcaster for the wake broadcast (a connectable ADV_IND, which needs a
# spare connection object -- hence MAX_CONN = 3 cameras + 1).
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_DEVICE_NAME="DJI-Remote"

# No pairing/encryption: DJI cameras withhold notifications from clients that
# advertise encryption support but never pair (same as the original firmware,
# which ran NimBLE with CONFIG_BT_NIMBLE_SECURITY_ENABLE=n).
CONFIG_BT_SMP=n

# The DJI protocol frames are well under 247 bytes; the original asked for a
# 500 byte MTU, which would cost far too much RAM with four links on a
# 256 KB part.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# --- Console / logging over USB CDC ACM ---------------------------------
# The Pro Micro has no debug UART broken out; the board devicetree already
# points zephyr,console at a CDC ACM node, so the USB device stack just has
# to come up at boot. Logs appear on the USB serial port.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
